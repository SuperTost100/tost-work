  /* The app's own tokens and components (apps/desktop/src/renderer/src/styles/app.css), copied at the same sizes. */
  :root {
    --canvas: #faf8f4; --side: #f3f0ea; --panel: #efebe3; --paper: #ffffff; --line: #e6e1d8; --line-2: #eeeae3;
    --hover: rgba(27, 23, 18, 0.045); --ink: #1b1712; --t2: #57504a; --t3: #6b6255; --taupe: #9c8b73;
    --btn: #1b1712; --on-btn: #faf8f4; --need: #9a5b0b; --danger: #b23a2b; --field-line: #e6e1d8;
    --raised: 0 0 0 1px rgba(27, 23, 18, 0.05), 0 1px 3px rgba(27, 23, 18, 0.12);
    --veil: rgba(250, 248, 244, 0.7);
    --tb-bg: #f3f3f3; --tb-ink: #1b1b1b; --tb-line: #e3e3e3;
    --gt-bg: #ebebeb; --gt-ink: #2e3436; --gt-line: #d4d4d4;
    color-scheme: light;
  }
  body[data-theme="dark"] {
    --canvas: #22201d; --side: #1b1917; --panel: #2c2925; --paper: #2a2723; --line: #36322d; --line-2: #2f2b27;
    --hover: rgba(255, 250, 240, 0.045); --ink: #eeeae3; --t2: #b7afa4; --t3: #9d958a; --taupe: #b9a88f;
    --btn: #eeeae3; --on-btn: #1b1712; --need: #e3a452; --danger: #ec8a7a; --field-line: #807869;
    --raised: 0 0 0 1px rgba(255, 250, 240, 0.06), 0 1px 3px rgba(0, 0, 0, 0.45);
    --veil: rgba(20, 18, 16, 0.7);
    --tb-bg: #202020; --tb-ink: #ffffff; --tb-line: #2b2b2b;
    --gt-bg: #303030; --gt-ink: #ffffff; --gt-line: #1e1e1e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--side); color: var(--ink); font: 400 14px/1.5 "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  p, h1, h2, h3, h4 { margin: 0; }
  [hidden] { display: none !important; }

  /* The page around the mockup. */
  .bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 10px 24px; background: var(--paper); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--t2); }
  .bar b { color: var(--ink); font-weight: 600; margin-right: 2px; }
  .bar .grow { flex: 1; }
  .bar .grp { display: inline-flex; gap: 6px; align-items: center; }
  .bar .grp.off { opacity: .4; }
  .bar button { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); }
  .bar button.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .wrap { max-width: 1328px; margin: 0 auto; padding: 28px 24px 80px; }
  .wrap h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  .lead { color: var(--t2); font-size: 15px; max-width: 860px; margin: 8px 0 14px; }
  .note { color: var(--t2); font-size: 14px; max-width: 860px; margin: 0 0 18px; }
  .note b { color: var(--ink); }
  .scroll { overflow-x: auto; padding-bottom: 8px; }

  /* The window: a native title bar above the app, 1280px wide. */
  .win { width: 1280px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.12); background: var(--canvas); }
  .tbar { display: flex; align-items: center; height: 32px; background: var(--tb-bg); color: var(--tb-ink); font: 400 12px/1 "Segoe UI", system-ui, sans-serif; border-bottom: 1px solid var(--tb-line); }
  .tbar .ico { margin: 0 8px 0 10px; display: flex; }
  .tbar .grow { flex: 1; }
  .tbar .cap { width: 46px; height: 32px; display: grid; place-items: center; }
  .gbar { display: flex; align-items: center; height: 38px; background: var(--gt-bg); color: var(--gt-ink); font: 700 13px/1 "Cantarell", system-ui, sans-serif; border-bottom: 1px solid var(--gt-line); padding: 0 8px; }
  .gbar .t { flex: 1; text-align: center; padding-left: 28px; }
  .gbar .x { width: 24px; height: 24px; border-radius: 50%; background: rgba(127,127,127,.2); display: grid; place-items: center; }
  .app { position: relative; display: flex; isolation: isolate; background: var(--canvas); }

  .ic { display: inline-block; width: 17px; height: 17px; flex: none; background-color: currentColor; -webkit-mask: no-repeat center / contain; mask: no-repeat center / contain; }
  .row { display: flex; align-items: center; gap: 8px; }
  .t2 { color: var(--t2); } .t3 { color: var(--t3); }

  /* Sidebar */
  .side { width: 248px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 0 10px 10px; border-right: 1px solid var(--line-2); }
  .side .chrome { height: 44px; display: flex; align-items: center; padding: 0 4px; }
  .iconbtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--t2); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 6px 14px; }
  .brand svg { width: 24px; height: 24px; flex: none; }
  .brand b { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
  .search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--canvas); border: 1px solid var(--field-line); color: var(--t3); font-size: 14px; margin-bottom: 8px; }
  body[data-theme="dark"] .search { background: var(--panel); }
  .nav { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--ink); font-size: 14px; }
  .nav .ic { color: var(--t2); }
  .nav.on { background: var(--paper); box-shadow: var(--raised); font-weight: 500; }
  .side h4 { margin: 18px 8px 4px; font-size: 13px; font-weight: 500; color: var(--t3); }
  .rec { display: block; height: 30px; line-height: 30px; padding: 0 8px; border-radius: 8px; font-size: 14px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec.on { background: var(--paper); box-shadow: var(--raised); color: var(--ink); }
  .me { display: flex; align-items: center; gap: 4px; padding: 8px 0 0; border-top: 1px solid var(--line-2); margin-top: 8px; }
  .me .who-btn { display: flex; align-items: center; gap: 10px; flex: 1; padding: 6px; border-radius: 8px; font-size: 14px; line-height: 1.2; }
  .me .gear { width: 38px; align-self: stretch; border-radius: 8px; display: grid; place-items: center; color: var(--t2); }
  .me .gear.on { background: var(--hover); color: var(--ink); }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--taupe); color: #1b1712; display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Buttons, tags, notices */
  .btn { height: 32px; padding: 0 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--paper); white-space: nowrap; }
  .btn:hover { border-color: var(--t3); }
  .btn.dark { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
  .btn.dark:hover { opacity: .88; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn .ic { width: 15px; height: 15px; }
  .tag { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px; background: var(--panel); color: var(--t2); font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace; white-space: nowrap; flex: none; }
  .tag .pulse { margin-right: 6px; }
  .pulse { display: inline-flex; gap: 3px; flex: none; }
  .pulse i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
  .pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pulse i { animation: none; opacity: .6; } }
  .tag.bad { color: var(--need); }

  /* Setup */
  .solo { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; align-items: start; }
  .setup { width: 560px; display: grid; gap: 20px; position: relative; z-index: 1; margin: 132px 0 40px; }
  .tall .setup { margin-top: 40px; }
  .setup .brand2 { display: flex; align-items: center; gap: 10px; }
  .setup .brand2 svg { width: 28px; height: 28px; }
  .setup .brand2 b { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .dots { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--t3); }
  .dots i { width: 22px; height: 3px; border-radius: 2px; background: var(--line); display: block; }
  .dots i.on { background: var(--ink); }
  .setup h1 { font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -0.03em; }
  .setup h1 span { color: var(--taupe); }
  .setup .lede { color: var(--t2); font-size: 15px; margin-top: -8px; }
  .sprig { position: absolute; bottom: 0; pointer-events: none; opacity: .9; }
  body[data-theme="dark"] .sprig { opacity: .5; }
  .opts { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); background: var(--paper); }
  .opt.wide { grid-template-columns: 1fr; }
  .opt b, .acct b { display: block; font-weight: 600; font-size: 15px; color: var(--ink); }
  .opt .d { display: block; font-size: 13px; color: var(--t3); }
  .opt .d.ok { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .opt .d.ok .ic { width: 14px; height: 14px; }
  .opt.on { box-shadow: 0 0 0 2px var(--ink); }
  .keybox { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .input { height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--field-line); background: var(--paper); color: var(--ink); font: inherit; min-width: 0; }
  .btn:focus-visible { outline: none; }
  .input::placeholder { color: var(--t3); opacity: 1; }
  .grow { flex: 1; min-width: 0; }

  /* Settings */
  .settings { display: grid; grid-template-columns: 232px 1fr; flex: 1; min-height: 0; }
  .snav { border-right: 1px solid var(--line-2); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .snav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: var(--t2); white-space: nowrap; }
  .snav a.on { background: var(--paper); box-shadow: var(--raised); color: var(--ink); font-weight: 500; }
  .snav .report { margin-top: auto; }
  .sbody { max-width: 760px; padding: 28px 44px 64px; }
  .sbody h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
  .acct { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  .acct b { font-weight: 500; }
  .acct .d { display: block; font-size: 13px; color: var(--t3); }
  .acct .keybox { max-width: 420px; }

  /* The new parts */
  .warn { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; margin-top: -2px; padding: 9px 11px; border-radius: 8px; background: var(--panel); color: var(--t2); font-size: 13px; line-height: 1.45; }
  .warn .ic { width: 15px; height: 15px; margin-top: 2px; color: var(--need); }
    .sbx { border-radius: 12px; background: var(--panel); padding: 16px 18px; display: grid; gap: 10px; }
  .sbx > b { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .sbx > b .ic { color: var(--need); }
  .sbx.ok > b .ic { color: var(--ink); }
  .sbx p { font-size: 14px; color: var(--t2); }
  .sbx .small { font-size: 13px; color: var(--t3); }
  .sbx .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .sbx .tags .tag { background: var(--canvas); }
  .sbx .step { display: grid; gap: 6px; }
  .sbx .step > span { font-size: 13px; font-weight: 500; color: var(--t2); }
  .code { color: var(--ink); position: relative; border-radius: 8px; background: var(--canvas); box-shadow: 0 0 0 1px var(--line); padding: 10px 84px 10px 12px; }
  body[data-theme="dark"] .code { background: var(--side); }
  .code pre { margin: 0; font: 500 12.5px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); white-space: pre; overflow-x: auto; user-select: all; }
  .code .btn { position: absolute; top: 6px; right: 6px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

  /* A task */
  .top { height: 44px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px 0 22px; }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--t2); white-space: nowrap; }
  .crumb b { color: var(--ink); font-weight: 600; }
  .taskcol { flex: 1; min-height: 0; overflow: auto; }
  .col { width: 720px; margin: 0 auto; padding: 24px 0 24px; }
  .you { max-width: 78%; background: var(--panel); border-radius: 14px; padding: 11px 15px; font-size: 15px; }
  .agent { font-size: 15px; line-height: 1.6; margin-top: 22px; }
  .agent p { margin: 0 0 10px; }
  .agent code, code.i { font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace; }
  .failbox { display: grid; gap: 12px; }
  .failbox .head { font-weight: 600; font-size: 15px; }
  .raw { margin-top: 2px; font-size: 13px; color: var(--t3); }
  .raw summary { cursor: pointer; width: fit-content; }
  .raw > pre { margin: 8px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--panel); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .composer { margin: 0 auto 16px; width: 720px; background: var(--paper); border: 1px solid var(--field-line); border-radius: 16px; padding: 14px 16px 12px; display: grid; gap: 14px; color: var(--t3); font-size: 15px; box-shadow: 0 1px 2px rgba(27,23,18,.04), 0 4px 16px rgba(27,23,18,.04); }
  body[data-theme="dark"] .composer { box-shadow: none; }
  .composer .r { display: flex; align-items: center; justify-content: space-between; }
  .send { width: 32px; height: 32px; border-radius: 50%; background: var(--line); display: grid; place-items: center; color: var(--canvas); }

  /* The app's confirmation card */
  .veil { position: absolute; inset: 0; z-index: 10; background: var(--veil); backdrop-filter: blur(2px); }
  .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; background: var(--canvas); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 24px 70px rgba(0,0,0,.18); overflow: hidden; }
  .modal .cb { display: grid; gap: 10px; padding: 20px 20px 18px; }
  .modal .cb b { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  .modal .cb p { font-size: 14px; line-height: 1.5; color: var(--t2); }
  .modal .mf { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line-2); }

const SCREENS = ["win-setup", "win-settings", "lin-setup", "lin-task"];
const S = { screen: "win-setup", opt: "A", lang: "it", theme: "light", ready: false, popup: false, installing: false, checking: false, aaOpen: false, rawOpen: false, copied: {} };
const q = new URLSearchParams(location.hash.slice(1));
if (SCREENS.includes(q.get("screen"))) S.screen = q.get("screen");
if (["A", "B", "C"].includes(q.get("opt"))) S.opt = q.get("opt");
if (["it", "en"].includes(q.get("lang"))) S.lang = q.get("lang");
if (["light", "dark"].includes(q.get("theme"))) S.theme = q.get("theme");
S.ready = q.get("ready") === "1"; S.popup = q.get("popup") === "1"; S.aaOpen = q.get("aa") === "1"; S.rawOpen = q.get("raw") === "1";

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const ic = (n, cls = "") => `<span class="ic i-${n} ${cls}" aria-hidden="true"></span>`;
const t = () => T[S.lang];
const winScreen = () => S.screen.startsWith("win");
const showNote = () => S.opt === "B" || S.opt === "C";
const showPopup = () => S.opt === "A" || S.opt === "C";

function titlebar() {
  const x = t();
  if (winScreen()) {
    const g = (d) => `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">${d}</svg>`;
    return `<div class="tbar"><span class="ico"><svg width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1b1712"/><path d="M14 17h36v6H35v26h-6V23H14z" fill="#faf8f4"/></svg></span><span>${x.win.title}</span><span class="grow"></span><span class="cap">${g('<path d="M0 5h10"/>')}</span><span class="cap">${g('<rect x=".5" y=".5" width="9" height="9"/>')}</span><span class="cap">${g('<path d="M0 0l10 10M10 0L0 10"/>')}</span></div>`;
  }
  return `<div class="gbar"><span class="t">${x.win.title}</span><span class="x">${ic("close")}</span></div>`;
}

function sidebar(gearOn) {
  const x = t().side; const icons = ["edit-2", "folder", "magic-2", "calendar", "task"];
  const failed = S.screen === "lin-task";
  return `<aside class="side"><div class="chrome"><span class="grow"></span><span class="iconbtn">${ic("layout-leftbar-close")}</span></div>
    <div class="brand">${LOGO}<b>Tost Work</b></div>
    <div class="search">${ic("search")}<span>${x.search}</span></div>
    ${x.nav.map((n, i) => `<div class="nav${i === 0 && !gearOn && !failed ? "" : ""}">${ic(icons[i])}${n}</div>`).join("")}
    <h4>${x.recent}</h4>
    ${x.tasks.map((n, i) => `<span class="rec${i === 2 && failed ? " on" : ""}">${n}</span>`).join("")}
    <span class="grow"></span>
    <div class="me"><span class="who-btn"><span class="avatar">T</span>${x.me}</span><span class="gear${gearOn ? " on" : ""}">${ic("settings-3")}</span></div></aside>`;
}

/* Claude's row, in the setup option card or the settings account row. */
function claudeBody(variant) {
  const a = t().ai, w = t().winwarn;
  const detail = S.installing ? a.installing : a.claudeMissing;
  const note = showNote() ? `<span class="warn" role="note">${ic("alert")}<span>${w.note}</span></span>` : "";
  const action = S.installing ? "" : `<button class="btn" data-act="install">${a.install}</button>`;
  if (variant === "setup") return `<div class="opt"><span><b>${a.claude}</b><span class="d">${detail}</span></span>${action}${note}</div>`;
  return `<div class="acct"><span><b>${a.claude}</b><span class="d">${detail}</span></span>${action}${note}</div>`;
}

function winSetup() {
  const a = t().ai, s = t().setup;
  return `<div class="solo"><div class="setup">
    <div class="brand2">${LOGO}<b>Tost Work</b></div>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><span style="margin-left:6px">${s.step}</span></div>
    <h1>${s.title}<br><span>${s.sub}</span></h1>
    <p class="lede">${s.lede}</p>
    <div class="opts">
      <div class="opt"><span><b>${a.chatgpt}</b><span class="d">${a.chatgptD}</span></span><button class="btn">${a.signIn}</button></div>
      ${claudeBody("setup")}
      <div class="opt wide"><span><b>${a.key}</b><span class="d">${a.keyD}</span><span class="keybox"><input class="input grow" placeholder="sk-…" aria-label="${a.key}" type="password"><button class="btn" disabled>${a.useKey}</button></span></span></div>
    </div>
    <div class="row"><button class="btn">${s.back}</button><span class="grow"></span><span class="t3" style="font-size:13px">${s.next}</span><button class="btn">${s.skip}</button></div>
  </div>${SPRIGS}</div>`;
}

function winSettings() {
  const a = t().ai, st = t().settings, icons = ["layers", "key-2", "translate", "notification"];
  return `<div class="settings"><nav class="snav">${st.nav.map((n, i) => `<a class="${i === 1 ? "on" : ""}">${ic(icons[i])}${n}</a>`).join("")}<a class="report">${ic("bug")}${st.report}</a><a>${ic("information")}${st.about}</a></nav>
    <div class="scontent"><div class="sbody"><h1>${st.title}</h1>
      <div class="acct"><span><b>${a.chatgpt}</b><span class="d">${a.connectedAs}</span></span><button class="btn">${a.signOut}</button></div>
      ${claudeBody("settings")}
      <div class="acct"><span><b>${a.key}</b><span class="d">${a.notConnected}</span><span class="keybox"><input class="input grow" placeholder="sk-…" type="password" aria-label="${a.key}"><button class="btn" disabled>${a.useKey}</button></span></span></div>
    </div></div></div>`;
}

function winDialog() {
  const w = t().winwarn;
  return `<div class="veil" id="veil"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dt"><div class="cb"><b id="dt">${w.title}</b><p>${w.p1}</p><p>${w.p2}</p></div><div class="mf"><span class="grow"></span><button class="btn" data-act="cancel" id="cancel">${w.cancel}</button><button class="btn dark" data-act="go">${w.go}</button></div></div></div>`;
}

const codeBlock = (id, cmd) => `<div class="code"><pre>${esc(cmd)}</pre><button class="btn sm" data-copy="${id}">${ic("copy-2")}${S.copied[id] ? t().linux.copied : t().linux.copy}</button></div>`;
const CMDS = { apt: CMD_APT, aa: CMD_APPARMOR };

function linSetup() {
  const L = t().linux, s = t().setup, a = t().ai;
  let panel;
  if (S.ready) {
    panel = `<div class="sbx ok"><b>${ic("check")}${L.okTitle}</b><p class="small">${L.okP}</p></div>`;
  } else {
    panel = `<div class="sbx"><b>${ic("alert")}${L.title}</b><p>${L.p}</p>
      <div class="tags"><span class="tag">${L.tags.bwrap[0]}</span><span class="tag">${L.tags.socat[0]}</span><span class="tag">${L.tags.aa[0]}</span></div>
      <div class="step"><span>${L.s1}</span>${codeBlock("apt", CMD_APT)}</div>
      <div class="step"><span>${L.s2}</span>${codeBlock("aa", CMD_APPARMOR)}</div>
      <div class="actions"><button class="btn" data-act="check"${S.checking ? " disabled" : ""}>${ic("refresh-2")}${S.checking ? L.checking : L.check}</button><span class="t3" style="font-size:13px">${L.later}</span></div></div>`;
  }
  return `<div class="solo tall"><div class="setup">
    <div class="brand2">${LOGO}<b>Tost Work</b></div>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><span style="margin-left:6px">${s.step}</span></div>
    <h1>${s.title}<br><span>${s.sub}</span></h1>
    <p class="lede">${s.lede}</p>
    ${panel}
    <div class="opts">
      <div class="opt"><span><b>${a.chatgpt}</b><span class="d">${a.chatgptD}</span></span><button class="btn">${a.signIn}</button></div>
      <div class="opt"><span><b>${a.claude}</b><span class="d">${a.claudeMissing}</span></span><button class="btn">${a.install}</button></div>
      <div class="opt wide"><span><b>${a.key}</b><span class="d">${a.keyD}</span><span class="keybox"><input class="input grow" placeholder="sk-…" type="password" aria-label="${a.key}"><button class="btn" disabled>${a.useKey}</button></span></span></div>
    </div>
    <div class="row"><button class="btn">${s.back}</button><span class="grow"></span><span class="t3" style="font-size:13px">${s.next}</span><button class="btn">${s.skip}</button></div>
  </div>${SPRIGS}</div>`;
}

function linTask() {
  const L = t().linux;
  const tag = S.ready ? `<span class="tag"><span class="pulse"><i></i><i></i><i></i></span>${L.workingTag}</span>` : `<span class="tag">${L.failedTag}</span>`;
  let body;
  if (S.ready) {
    body = `<div class="agent"><p>${L.resumed}</p></div>`;
  } else {
    body = `<div class="agent failbox"><div class="head">${L.failHead}</div><p style="margin:0">${L.failP}</p>
      ${codeBlock("apt", CMD_APT)}
      <details class="raw" ${S.aaOpen ? "open" : ""} data-key="aaOpen"><summary>${L.aaMore}</summary><div style="margin-top:8px">${codeBlock("aa", CMD_APPARMOR)}</div></details>
      <div class="actions"><button class="btn dark" data-act="retry"${S.checking ? " disabled" : ""}>${ic("refresh-2")}${S.checking ? L.checking : L.retry}</button></div>
      <details class="raw" ${S.rawOpen ? "open" : ""} data-key="rawOpen"><summary>${L.raw}</summary><pre>${esc(L.rawPrefix + RAW)}</pre></details></div>`;
  }
  return `<aside style="display:contents">${sidebar(false)}</aside><main class="main"><div class="top"><span class="crumb">${L.crumb} <span class="t3">/</span> <b>${L.taskTitle}</b></span><span class="grow"></span>${tag}</div>
    <div class="taskcol"><div class="col"><div class="you">${L.taskPrompt}</div>${body}</div></div>
    <div class="composer"><span>${L.composer}</span><div class="r">${ic("add")}<span class="send">${ic("arrow-up")}</span></div></div></main>`;
}

function render() {
  const x = t();
  document.documentElement.lang = S.lang; document.body.dataset.theme = S.theme;
  const sc = S.screen, isWin = winScreen();
  const seg = (key, labels, values, cur) => labels.map((l, i) => `<button data-${key}="${values[i]}" class="${cur === values[i] ? "on" : ""}">${l}</button>`).join("");
  document.getElementById("bar").innerHTML =
    `<span class="grp"><b>${x.bar.screen}</b>${seg("screen", x.bar.screens, SCREENS, sc)}</span><span class="grow"></span>` +
    `<span class="grp${isWin ? "" : " off"}"><b>${x.bar.opt}</b>${seg("opt", x.bar.opts, ["A", "B", "C"], S.opt)}</span>` +
    `<span class="grp${isWin ? " off" : ""}"><b>${x.bar.sbx}</b>${seg("ready", x.bar.sbxs, ["0", "1"], S.ready ? "1" : "0")}</span><span class="grow"></span>` +
    `<span class="grp"><b>${x.bar.lang}</b>${seg("lang", ["IT", "EN"], ["it", "en"], S.lang)}</span>` +
    `<span class="grp"><b>${x.bar.theme}</b>${seg("theme", x.bar.themes, ["light", "dark"], S.theme)}</span>`;
  document.getElementById("h1").textContent = x.h1;
  document.getElementById("lead").textContent = x.lead;
  const n = x.notes[sc]; document.getElementById("note").innerHTML = n[S.opt] || n._;
  const inner = { "win-setup": winSetup, "win-settings": () => `${sidebar(true)}<main class="main">${winSettings()}</main>`, "lin-setup": linSetup, "lin-task": linTask }[sc]();
  const dialog = isWin && S.popup && showPopup() ? winDialog() : "";
  document.getElementById("win").innerHTML = titlebar() + `<div class="app" style="height:${sc === "lin-setup" ? (S.ready ? 900 : 1210) : sc === "win-settings" || sc === "win-setup" ? 828 : 862}px">${inner}${dialog}</div>`;
  if (dialog) document.getElementById("cancel")?.focus({ preventScroll: true });
}

async function copy(id) {
  try { await navigator.clipboard.writeText(CMDS[id]); } catch (e) { /* the mockup still shows the state */ }
  S.copied[id] = true; render();
  setTimeout(() => { S.copied[id] = false; render(); }, 1600);
}
function runCheck() {
  S.checking = true; render();
  setTimeout(() => { S.checking = false; S.ready = true; render(); }, 700);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.screen) { Object.assign(S, { screen: d.screen, popup: false, installing: false, checking: false }); }
  else if (d.opt) Object.assign(S, { opt: d.opt, popup: false, installing: false });
  else if (d.ready !== undefined) Object.assign(S, { ready: d.ready === "1" });
  else if (d.lang) S.lang = d.lang;
  else if (d.theme) S.theme = d.theme;
  else if (d.copy) return void copy(d.copy);
  else if (d.act === "install") { if (showPopup()) S.popup = true; else S.installing = true; }
  else if (d.act === "cancel") S.popup = false;
  else if (d.act === "go") { S.popup = false; S.installing = true; }
  else if (d.act === "check" || d.act === "retry") return void runCheck();
  else return;
  render();
});
document.addEventListener("toggle", (e) => { const k = e.target.dataset?.key; if (k) S[k] = e.target.open; }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.popup) { S.popup = false; render(); } });
render();
</script>
