name: Package

# Builds the Mac, Windows and Linux apps. On pull requests that change the packaging the Mac app is signed ad-hoc, with no
# certificate or secret, so a broken build shows up before a release needs it. Started by hand (Actions > Package > Run
# workflow), it signs with the Developer ID certificate and has Apple notarize the app: that's the build a release ships.
# The Windows and Linux apps aren't signed yet (#148), and each one runs scripts/smoke.mjs, since no one on the team
# opens them day to day. The Microsoft Store package is built unsigned for upload, since the Store signs it, and a
# test-signed copy runs the smoke test inside its package. It publishes nothing: the installers are workflow artifacts.
#
# shortcut: the signing secrets are repository secrets, so a workflow changed on a branch could reach them. Only Tost and
# his agents push here. Move them to a "release" environment limited to main once anyone else gets write access.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - .github/workflows/package.yml
      - apps/desktop/scripts/fetch-officecli.mjs
      - apps/desktop/scripts/smoke.mjs
      - apps/desktop/scripts/store-version.mjs
      - apps/desktop/build/**
      # A lockfile or override change can break packaging, as a dependency fix for electron-builder's tools would.
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  mac:
    name: Mac app
    runs-on: macos-latest
    env:
      # electron-builder downloads its own Electron for the target, so the dev binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SIGNED: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs third-party install and packaging scripts; none of them needs the job's token.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tost-work/desktop build
      - run: node apps/desktop/scripts/fetch-officecli.mjs mac-arm64 mac-x64
      - name: Package, signed ad-hoc
        if: env.SIGNED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder skips signing on pull requests unless told otherwise.
          CSC_FOR_PULL_REQUEST: "true"
        # Without any signature macOS calls the downloaded app "damaged". With an ad-hoc one the hardened runtime blocks
        # Electron's own libraries, and Apple notarizes only Developer ID signatures.
        run: >-
          pnpm --filter @tost-work/desktop exec electron-builder --mac --publish never
          -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Package, signed with the Developer ID and notarized
        if: env.SIGNED == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # notarytool reads the API key from a file. It lives in the runner's temp folder, which is wiped after the job.
        # The key is rewritten as a clean PEM, because notarytool rejects one with stray spaces or line breaks, as a key
        # pasted from a browser can have. openssl checks it before Apple sees it, and prints nothing of it.
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
          body=$(printf '%s' "$APPLE_API_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          unset APPLE_API_KEY_P8
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$APPLE_API_KEY"
          unset body
          openssl pkey -in "$APPLE_API_KEY" -noout || { echo "::error::APPLE_API_KEY_P8 isn't a readable private key"; exit 1; }
          pnpm --filter @tost-work/desktop exec electron-builder --mac --publish never
          rm -f "$APPLE_API_KEY"
      # An app whose signature doesn't match its contents opens on no Mac: macOS calls it "damaged".
      - name: Check the apps' signatures
        working-directory: apps/desktop/release
        run: |
          for app in "mac-arm64/Tost Work.app" "mac/Tost Work.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            # OfficeCLI must still carry its own signature, or a downloaded copy won't run on a Mac.
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/bin/officecli"
            codesign -dvv "$app/Contents/Resources/bin/officecli" 2>&1 | grep "Authority=Developer ID Application"
          done
      # A release build must carry Tost's Developer ID and Apple's ticket, or Gatekeeper blocks its first launch.
      - name: Check the signature and the notarization
        if: env.SIGNED == 'true'
        working-directory: apps/desktop/release
        run: |
          for app in "mac-arm64/Tost Work.app" "mac/Tost Work.app"; do
            codesign -dvv "$app" 2>&1 | grep "Authority=Developer ID Application: TOMMASO BARBERA (T7U74299G3)"
            codesign -dvv "$app" 2>&1 | grep "flags=0x10000(runtime)"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /dev/stderr | grep "source=Notarized Developer ID"
          done
      - name: Check that the bundled OfficeCLI runs
        working-directory: apps/desktop/release
        env:
          OFFICECLI_SKIP_UPDATE: "1"
          OFFICECLI_NO_AUTO_RESIDENT: "1"
        run: |
          officecli="mac-arm64/Tost Work.app/Contents/Resources/bin/officecli"
          "$officecli" --version
          "$officecli" create /tmp/check.docx
          "$officecli" validate /tmp/check.docx
          test -f "mac-arm64/Tost Work.app/Contents/Resources/skills/word/SKILL.md"
      # The artifact's name says which build it is, as the app's About panel and Settings do.
      - name: Name the artifact
        id: name
        run: echo "name=tost-work-mac-$(node -p "require('./apps/desktop/package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: apps/desktop/release/*.dmg
          # A packaging change that stops producing DMGs must fail the check, not pass with a warning.
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # No certificate yet: the installer is unsigned, and Windows warns before running it (#148).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tost-work/desktop build
      - run: node apps/desktop/scripts/fetch-officecli.mjs win-x64
      - run: pnpm --filter @tost-work/desktop exec electron-builder --win --x64 --publish never
      - name: Check that the bundled OfficeCLI runs
        working-directory: apps/desktop/release/win-unpacked
        env:
          OFFICECLI_SKIP_UPDATE: "1"
          OFFICECLI_NO_AUTO_RESIDENT: "1"
        run: |
          resources/bin/officecli.exe --version
          resources/bin/officecli.exe create "$RUNNER_TEMP/check.docx"
          resources/bin/officecli.exe validate "$RUNNER_TEMP/check.docx"
          test -f resources/skills/word/SKILL.md
      # The smoke test runs on the app the installer puts on disk, so a broken installer fails here too.
      - name: Install the app
        shell: pwsh
        run: |
          $setup = Get-Item "apps/desktop/release/Tost Work Setup *.exe"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Write-Error "The installer exited with code $($install.ExitCode)"; exit 1 }
          $app = Get-Item "$env:LOCALAPPDATA\Programs\tost-work\Tost Work.exe" -ErrorAction SilentlyContinue
          if (-not $app) { Write-Error "The installer put no Tost Work.exe in $env:LOCALAPPDATA\Programs\tost-work"; exit 1 }
          "APP_EXE=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Open the app and run a task
        working-directory: apps/desktop
        run: node scripts/smoke.mjs "$APP_EXE" "$RUNNER_TEMP/smoke"
      - name: Keep the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Name the artifact
        id: name
        run: echo "name=tost-work-windows-$(node -p "require('./apps/desktop/package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  store:
    name: Microsoft Store package
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tost-work/desktop build
      - run: node apps/desktop/scripts/fetch-officecli.mjs win-x64
      # The Store rejects a version starting with 0, so the package carries the Store's number for this version. The app
      # still shows its own: it's built into the code.
      - name: Package for the Store, unsigned
        run: |
          version=$(node apps/desktop/scripts/store-version.mjs)
          echo "STORE_VERSION=$version" >> "$GITHUB_ENV"
          pnpm --filter @tost-work/desktop exec electron-builder --win appx --x64 --publish never -c.extraMetadata.version="$version"
      # Windows installs only signed packages, so CI signs a copy with a throwaway certificate under the Store's publisher
      # name, trusts it on this runner only, and installs that. The unsigned package is the one the Store gets.
      - name: Install a test-signed copy
        shell: pwsh
        run: |
          $appx = Get-Item "apps/desktop/release/*.appx"
          $copy = Join-Path $env:RUNNER_TEMP "test-signed.appx"
          Copy-Item $appx.FullName $copy
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=A368B52B-5248-4F8B-ADC9-335608EADB2C" `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "test.pfx"
          $password = ConvertTo-SecureString -String "throwaway" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p throwaway $copy
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed"; exit 1 }
          Add-AppxPackage -Path $copy
          $installed = Get-AppxPackage -Name Tost.TostWork
          if (-not $installed) { Write-Error "The package didn't install"; exit 1 }
          "Installed $($installed.PackageFullName)"
          Remove-Item $pfx
      # The alias starts the app inside its package. Its data must land in the real AppData folder, where the AI tools
      # see it, and not in the package's private copy.
      - name: Open the app in its package and run a task
        working-directory: apps/desktop
        run: node scripts/smoke.mjs "$LOCALAPPDATA/Microsoft/WindowsApps/tost-work.exe" "$RUNNER_TEMP/smoke" "$APPDATA/Tost Work"
      - name: Keep the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-store-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Name the artifact
        id: name
        run: echo "name=tost-work-store-$(node -p "require('./apps/desktop/package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tost-work/desktop build
      - run: node apps/desktop/scripts/fetch-officecli.mjs linux-x64
      - run: pnpm --filter @tost-work/desktop exec electron-builder --linux --x64 --publish never
      - name: Check that the bundled OfficeCLI runs
        working-directory: apps/desktop/release/linux-unpacked
        env:
          OFFICECLI_SKIP_UPDATE: "1"
          OFFICECLI_NO_AUTO_RESIDENT: "1"
        run: |
          resources/bin/officecli --version
          resources/bin/officecli create "$RUNNER_TEMP/check.docx"
          resources/bin/officecli validate "$RUNNER_TEMP/check.docx"
          test -f resources/skills/word/SKILL.md
      # The smoke test runs the AppImage itself, as people download it. The runner has no FUSE 2, so it unpacks and runs.
      - name: Open the app and run a task
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a node scripts/smoke.mjs release/*.AppImage "$RUNNER_TEMP/smoke"
      - name: Keep the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Name the artifact
        id: name
        run: echo "name=tost-work-linux-$(node -p "require('./apps/desktop/package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 14
