name: Package

# Builds the Mac app, ad-hoc signed. It runs by hand, and on pull requests that change the packaging, so a broken build
# shows up before a release needs it. It publishes nothing: the DMGs are workflow artifacts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - .github/workflows/package.yml
      - apps/desktop/scripts/fetch-officecli.mjs

permissions:
  contents: read

jobs:
  mac:
    name: Mac app (ad-hoc signed)
    runs-on: macos-latest
    env:
      # electron-builder downloads its own Electron for the target, so the dev binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-builder skips signing on pull requests unless told otherwise. The signature is ad-hoc, so no
      # certificate or secret is involved.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs third-party install and packaging scripts; none of them needs the job's token.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tost-work/desktop build
      - run: node apps/desktop/scripts/fetch-officecli.mjs mac-arm64 mac-x64
      - run: pnpm --filter @tost-work/desktop exec electron-builder --mac --publish never
      # An app whose signature doesn't match its contents opens on no Mac: macOS calls it "damaged".
      - name: Check the apps' signatures
        working-directory: apps/desktop/release
        run: |
          for app in "mac-arm64/Tost Work.app" "mac/Tost Work.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            # OfficeCLI must still carry its own signature, or a downloaded copy won't run on a Mac.
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/bin/officecli"
            codesign -dvv "$app/Contents/Resources/bin/officecli" 2>&1 | grep "Authority=Developer ID Application"
          done
      - name: Check that the bundled OfficeCLI runs
        working-directory: apps/desktop/release
        env:
          OFFICECLI_SKIP_UPDATE: "1"
          OFFICECLI_NO_AUTO_RESIDENT: "1"
        run: |
          officecli="mac-arm64/Tost Work.app/Contents/Resources/bin/officecli"
          "$officecli" --version
          "$officecli" create /tmp/check.docx
          "$officecli" validate /tmp/check.docx
          test -f "mac-arm64/Tost Work.app/Contents/Resources/skills/word/SKILL.md"
      # The artifact's name says which build it is, as the app's About panel and Settings do.
      - name: Name the artifact
        id: name
        run: echo "name=tost-work-mac-$(node -p "require('./apps/desktop/package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: apps/desktop/release/*.dmg
          # A packaging change that stops producing DMGs must fail the check, not pass with a warning.
          if-no-files-found: error
          retention-days: 14
