# Packaging for Tost Work. The Mac app is signed with the Developer ID certificate and notarized by Apple, so it opens
# like any downloaded app. The certificate and the notarization key come from the environment (CSC_LINK,
# CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER); .github/workflows/package.yml sets them only for
# builds started by hand, and signs pull-request builds ad-hoc instead.
appId: one.tost.work
productName: Tost Work
# The packaged package.json is named tost-work, because the Windows installer names the install folder after it, which
# would be "@tost-workdesktop" from the workspace name. Electron names the data folder after productName, so it doesn't move.
extraMetadata:
  name: tost-work
directories:
  output: release
files:
  - out/**
  # The fake engine copies these sample files into tasks until the real engine lands.
  - resources/fake/**
  # The menu-bar and tray icons, read with nativeImage from the app's archive.
  - resources/tray/**
  - package.json
# Outside the app's archive, because Codex runs as its own process and reads them from disk. scripts/fetch-officecli.mjs
# puts each platform's OfficeCLI in resources/bin/<os>-<arch>.
extraResources:
  - from: resources/bin/${os}-${arch}
    to: bin
  - from: resources/skills
    to: skills
  # The licences of everything the app ships, written by the build (licenses.ts). Electron's own LICENSE and Chromium's
  # LICENSES.chromium.html are kept by electron-builder itself, next to the app on Windows and Linux and in Resources on Mac.
  - from: resources/generated/THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Notarization needs the hardened runtime. electron-builder's own entitlements let Electron's V8 run under it.
  hardenedRuntime: true
  # OfficeCLI keeps its own Developer ID signature, with the JIT entitlement .NET needs; an ad-hoc one would drop it.
  signIgnore:
    - /Contents/Resources/bin/officecli$
linux:
  # Set here and not at the top level, where it would also rename the Mac bundle to tost-work.app.
  executableName: tost-work
  # The .desktop file is named after package.json's desktopName, which Electron gives the window as its app id, so the
  # dock shows the window under the app's own icon.
  syncDesktopName: true
  category: Office
  target: [AppImage]
win:
  target: [nsis]
# The Microsoft Store package. It's uploaded unsigned: the Store signs it with Microsoft's certificate, which is the
# only free signing for Windows. The identity comes from Partner Center (Product identity). CI builds it with
# `--win appx` and a Store version from scripts/store-version.mjs, since the Store rejects a version starting with 0.
appx:
  identityName: Tost.TostWork
  publisher: CN=A368B52B-5248-4F8B-ADC9-335608EADB2C
  publisherDisplayName: Tost
  displayName: Tost Work
  applicationId: TostWork
  backgroundColor: "#1b1712"
  languages: [it-IT, en-US]
  # runFullTrust is always added. unvirtualizedResources lets the manifest keep the app's data and the AI tools'
  # installs visible outside the package; the Store approves it at submission.
  capabilities: [unvirtualizedResources]
  customManifestPath: appx-manifest.xml
  # Windows 10 version 2004 and later. Windows 10 ignores the per-folder exclusions and reads the older switches.
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
